<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 Climatizacao</title>
<style>
:root{
  --bg:#0f0f1a;--surface:#1a1a2e;--surface2:#16213e;
  --border:#252545;--accent:#00d4ff;--text:#e8e8f0;--muted:#7878a0;
  --green:#27ae60;--red:#e74c3c;--blue:#3498db;--radius:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:linear-gradient(135deg,#0f3460,#16213e);padding:14px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
header h1{font-size:1.1em;color:var(--accent);font-weight:700;letter-spacing:.5px}
.tag{margin-left:auto;font-size:.72em;color:var(--muted);background:var(--surface2);padding:3px 10px;border-radius:20px}
main{max-width:560px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.card h2{font-size:.75em;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:12px}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.stat-lbl{font-size:.72em;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-val{font-size:2em;font-weight:700;color:var(--accent);line-height:1}
.stat-unit{font-size:.45em;font-weight:400;color:var(--muted)}

/* state */
.state-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.badge{display:inline-block;padding:5px 14px;border-radius:20px;font-weight:600;font-size:.88em}
.s-conforto{background:rgba(39,174,96,.2);color:#4ade80}
.s-aquecendo{background:rgba(231,76,60,.2);color:#f87171}
.s-arrefecendo{background:rgba(52,152,219,.2);color:#60a5fa}
.s-desligado{background:rgba(120,120,160,.2);color:#9ca3af}
.thresholds{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
.thresh{font-size:.88em;color:var(--muted)}
.thresh strong{color:var(--text)}

/* buttons */
.btn{width:100%;padding:13px;border:none;border-radius:8px;cursor:pointer;font-size:1em;font-weight:600;transition:opacity .15s,transform .1s;letter-spacing:.3px}
.btn:active{transform:scale(.98);opacity:.85}
.btn-on{background:var(--green);color:#fff}
.btn-off{background:var(--red);color:#fff}
.btn-save{background:var(--accent);color:#000;font-weight:700}

/* form */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.fg{display:flex;flex-direction:column;gap:5px}
.fg label{font-size:.75em;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.fg input[type=number]{background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1em;padding:10px 12px;width:100%;-webkit-appearance:none;transition:border-color .2s}
.fg input[type=number]:focus{outline:none;border-color:var(--accent)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--border)}
.tg-info{font-size:.9em}
.tg-sub{font-size:.75em;color:var(--muted);margin-top:2px}
.sw{position:relative;width:46px;height:25px;flex-shrink:0}
.sw input{opacity:0;width:0;height:0}
.sw-track{position:absolute;inset:0;background:var(--border);border-radius:13px;cursor:pointer;transition:background .2s}
.sw-track::before{content:'';position:absolute;width:19px;height:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s}
.sw input:checked+.sw-track{background:var(--accent)}
.sw input:checked+.sw-track::before{transform:translateX(21px)}
.toast{margin-top:10px;padding:8px 12px;border-radius:8px;font-size:.85em;display:none}
.toast.ok{background:#1a3a2a;color:#4ade80;border:1px solid var(--green)}
.toast.err{background:#3a1a1a;color:#f87171;border:1px solid var(--red)}
.btn-danger{background:#c0392b;color:#fff}

/* table */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.82em;min-width:340px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
th{background:var(--surface2);color:var(--muted);font-size:.72em;text-transform:uppercase;letter-spacing:.5px}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.03)}
</style>
</head>
<body>
<header>
  <h1>ESP32-C6 &mdash; Climatizacao</h1>
  <span class="tag">leitura: {INTERVAL}s</span>
</header>
<main>

  <!-- Leituras -->
  <div class="stats">
    <div class="stat">
      <div class="stat-lbl">Temperatura</div>
      <div class="stat-val">{TEMP}<span class="stat-unit"> &deg;C</span></div>
    </div>
    <div class="stat">
      <div class="stat-lbl">Humidade</div>
      <div class="stat-val">{HUM}<span class="stat-unit"> %</span></div>
    </div>
  </div>

  <!-- Estado -->
  <div class="card">
    <div class="state-row">
      <span>Estado do sistema</span>
      <span id="sbadge" class="badge">{STATE}</span>
    </div>
    <div class="thresholds">
      <span class="thresh">T.Max: <strong>{TMAX} &deg;C</strong></span>
      <span class="thresh">T.Min: <strong>{TMIN} &deg;C</strong></span>
    </div>
  </div>

  <!-- Controlo ON/OFF -->
  <div class="card">
    <h2>Controlo Remoto</h2>
    <form method="post" action="/api/control">
      <button type="submit" class="btn {BTN_CLASS}">Sistema: {BTN_TEXT}</button>
    </form>
  </div>

  <!-- Configuracoes -->
  <div class="card">
    <h2>Configuracoes</h2>
    <form id="cfg">
      <div class="form-grid">
        <div class="fg">
          <label for="t_max">T. Maxima (&deg;C)</label>
          <input type="number" id="t_max" step="0.5" min="-20" max="60">
        </div>
        <div class="fg">
          <label for="t_min">T. Minima (&deg;C)</label>
          <input type="number" id="t_min" step="0.5" min="-20" max="60">
        </div>
      </div>
      <div class="form-grid" style="grid-template-columns:1fr">
        <div class="fg">
          <label for="leitura_s">Intervalo de leitura (s)</label>
          <input type="number" id="leitura_s" step="5" min="5" max="300">
        </div>
      </div>
      <div class="toggle-row">
        <div class="tg-info">
          Deep Sleep
          <div class="tg-sub">Activa na zona de conforto</div>
        </div>
        <label class="sw">
          <input type="checkbox" id="deep_sleep">
          <span class="sw-track"></span>
        </label>
      </div>
      <button type="submit" class="btn btn-save" style="margin-top:14px">Guardar alteracoes</button>
    </form>
    <div class="toast" id="msg"></div>
  </div>

  <!-- Logs -->
  <div class="card">
    <h2>Ultimos registos</h2>
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>Timestamp</th><th>Temp (&deg;C)</th><th>Estado</th><th>Evento</th></tr></thead>
        <tbody id="logs-tbody">{LOGS}</tbody>
      </table>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button id="btn-clear-logs" class="btn btn-danger" style="flex:1">Limpar Logs</button>
    </div>
    <div class="toast" id="msg-logs"></div>
  </div>

</main>
<script>
(function(){
  var b=document.getElementById('sbadge'),t=b.textContent.toLowerCase();
  if(t.indexOf('confort')>-1)       b.className='badge s-conforto';
  else if(t.indexOf('aquec')>-1)    b.className='badge s-aquecendo';
  else if(t.indexOf('arrefe')>-1)   b.className='badge s-arrefecendo';
  else                               b.className='badge s-desligado';
})();

fetch('/api/config').then(function(r){return r.json();}).then(function(d){
  document.getElementById('t_max').value=d.t_max;
  document.getElementById('t_min').value=d.t_min;
  document.getElementById('deep_sleep').checked=!!d.deep_sleep;
  document.getElementById('leitura_s').value=d.leitura_s;
}).catch(function(){});

document.getElementById('cfg').addEventListener('submit',function(e){
  e.preventDefault();
  var body={
    t_max:parseFloat(document.getElementById('t_max').value),
    t_min:parseFloat(document.getElementById('t_min').value),
    deep_sleep:document.getElementById('deep_sleep').checked,
    leitura_s:parseInt(document.getElementById('leitura_s').value,10)
  };
  if(body.t_max<body.t_min+2){
    var m=document.getElementById('msg');
    m.className='toast err';
    m.textContent='T.Max deve ser pelo menos 2°C acima de T.Min (histerese).';
    m.style.display='block';
    return;
  }
  fetch('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(function(r){return r.json();})
    .then(function(d){
      var m=document.getElementById('msg');
      m.className='toast '+(d.ok?'ok':'err');
      m.textContent=d.ok?'Guardado com sucesso!':'Erro ao guardar.';
      m.style.display='block';
      if(d.ok)setTimeout(function(){location.reload();},1200);
    })
    .catch(function(){
      var m=document.getElementById('msg');
      m.className='toast err';
      m.textContent='Erro de ligacao.';
      m.style.display='block';
    });
});

function refreshLogs(){
  fetch('/api/logs')
    .then(function(r){return r.text();})
    .then(function(html){document.getElementById('logs-tbody').innerHTML=html;})
    .catch(function(){});
}

document.getElementById('btn-clear-logs').addEventListener('click',function(){
  if(!confirm('Apagar todos os logs?')) return;
  fetch('/api/logs/clear',{method:'POST'})
    .then(function(r){return r.json();})
    .then(function(d){
      var m=document.getElementById('msg-logs');
      m.className='toast '+(d.ok?'ok':'err');
      m.textContent=d.ok?'Logs apagados.':'Erro ao apagar logs.';
      m.style.display='block';
      if(d.ok)refreshLogs();
    })
    .catch(function(){
      var m=document.getElementById('msg-logs');
      m.className='toast err';
      m.textContent='Erro de ligacao.';
      m.style.display='block';
    });
});
</script>
</body>
</html>
