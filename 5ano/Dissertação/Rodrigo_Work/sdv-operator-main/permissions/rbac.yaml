apiVersion: v1
kind: ServiceAccount
metadata:
  name: sdv-operator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sdv-operator
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]

- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch", "update"]

- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

- apiGroups: ["tsn.dev"]
  resources: ["tsnapps"]
  verbs: ["get", "list", "watch", "update", "patch", "delete"]

- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sdv-operator
subjects:
- kind: ServiceAccount
  name: sdv-operator
  namespace: default
roleRef:
  kind: ClusterRole
  name: sdv-operator
  apiGroup: rbac.authorization.k8s.io