apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: tsnswitches.tsn.dev
spec:
  scope: Namespaced
  group: tsn.dev
  names:
    kind: TsnSwitch
    plural: tsnswitches
    singular: tsnswitch
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec: # Specification for the TsnSwitch
              type: object
              properties:
                id:
                  description: switch unique ID
                  type: string
                host:
                  description: Host ip
                  type: string
                port:
                  description: Netconf Service Port
                  type: integer
                username:
                  description: Username
                  type: string
                password:
                  description: password
                  type: string
              required:
                - id
                - host
                - port
                - username
                - password