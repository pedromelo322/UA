spec:
  shaper: TAS
  tas:
    cycleTime: 20000000
    gateControlList:
      - index: 0
        gateState: 255
        timeInterval: 1000000
      - index: 1
        gateState: 15
        timeInterval: 5000000
      - index: 2
        gateState: 0
        timeInterval: 5000000